name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # dist/ is committed because it is the artefact consumers install. A stale
      # one means someone changed the palette and did not re-emit, and the three
      # encodings would no longer agree with each other.
      - name: dist/ is in sync with tokens/palette.mjs
        run: npm run tokens:check

      # Transition-period guard: this repo's web emitter must still produce the
      # bytes cubeui ships, for as long as both registries exist. `cubeui` is not
      # checked out here, so this passes trivially in CI and is the local guard.
      - name: The web emitter still matches cubeui
        run: npm run parity

      # compiled/ and registry.web.json are committed for the same reason dist/ is:
      # they are what a DOM app installs. This step re-runs the compiler and the
      # derivation and fails if either moved, which is also the only thing that
      # catches a compiler change that silently stops emitting for an item.
      - name: compiled/ and registry.web.json are in sync with registry/
        run: npm run compile:check

      - name: Types
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Build the registry
        run: npm run registry:build

      # Three failures that otherwise ship silently: two source files claiming
      # one item name, a `.web.tsx` whose exports drifted from its `.tsx`, and a
      # built item whose `content` is the empty string.
      - name: Collisions, platform-pair drift, empty content
        run: npm run registry:check

      # `shadcn build` writes public/r. A drifted checkout means someone edited
      # registry.json without rebuilding, and the published JSON would not match
      # the sources it names.
      - name: public/ is in sync with the two registry.json files
        run: git diff --exit-code -- public/r public/web

      # `npm test` runs two vitest projects, and the second one renders the
      # stories in a real browser. Without this step it fails at launch rather
      # than skipping, which is the intended behaviour: a silently-skipped
      # a11y suite is worse than a red build.
      - name: Chromium, for the story tests
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      # The stories are the compiler's evidence. If one stops building, the
      # Stage 0 verdict in the README is no longer backed by anything.
      - name: Storybook builds
        run: npm run build-storybook
